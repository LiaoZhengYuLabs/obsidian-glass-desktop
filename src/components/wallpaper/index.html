<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <link rel="apple-touch-icon" href="logo.png">
        <link rel="icon" href="logo.png">
        <link rel="stylesheet" href="space-environment/space-environment.css">

        <title>WebGL Fluid Simulation</title>
        <meta name="description" content="A WebGL fluid simulation that works in mobile browsers.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="Webgl Fluid Simulation">
        <meta property="og:description" content="A WebGL fluid simulation that works in mobile browsers.">
        <script type="text/javascript" src="js/dat.gui.min.js"></script>
        <style>
            * {
                user-select: none;
            }

            html, body {
                overflow: hidden;
                background-color: #000;
            }

            body {
                margin: 0;
                position: fixed;
                width: 100%;
                height: 100%;
                background-size: 100% 100%;
                isolation: isolate;
            }

            canvas {
                width: 100%;
                height: 100%;
            }

            #fluid-canvas,
            #animal-trail-canvas {
                position: fixed;
                inset: 0;
            }

            #fluid-canvas {
                z-index: 0;
            }

            #animal-trail-canvas {
                z-index: 2;
                pointer-events: none;
                contain: strict;
                transform: translateZ(0);
            }

            .dg {
                opacity: 0.9;
            }

            .dg .property-name {
                overflow: visible;
            }

            @font-face {
                font-family: 'iconfont';
                src: url('iconfont.ttf') format('truetype');
            }

            .bigFont {
                font-size: 150%;
                color: #8C8C8C;
            }

            .cr.function.appBigFont {
                font-size: 150%;
                line-height: 27px;
                color: #A5F8D3;
                background-color: #023C40;
            }

            .cr.function.appBigFont .property-name {
                float: none;
            }

            .cr.function.appBigFont .icon {
                position: sticky;
                bottom: 27px;
            }

            .icon {
                font-family: 'iconfont';
                font-size: 130%;
                float: right;
            }

            .twitter:before {
                content: 'a';
            }

            .github:before {
                content: 'b';
            }

            .app:before {
                content: 'c';
            }

            .discord:before {
                content: 'd';
            }
        </style>
    </head>

    <body>
        <canvas id="fluid-canvas"></canvas>
        <div id="space-environment" aria-hidden="true">
            <div class="space-background"></div>
            <div class="space-star-field"></div>
            <div class="space-constellation-layer"></div>
            <div class="space-black-hole-layer"></div>
            <div class="space-meteor-layer"></div>
            <div class="space-hero-layer"></div>
        </div>
        <canvas id="animal-trail-canvas" aria-hidden="true"></canvas>
        <script>
            // Lively renders this page in a hidden WebView. Its explicit
            // playback callback is the reliable pause signal for a wallpaper.
            window.__ANIMAL_TRAIL_WALLPAPER_HOST__ = true;
        </script>
        <script src="space-environment/space-config.js"></script>
        <script src="space-environment/space-environment.js"></script>
        <script src="animal-trail/catalog/creatures.js"></script>
        <script src="animal-trail/animal-trail.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
